name: Build Mesen SFC Performance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022

    defaults:
      run:
        working-directory: Mesen2-master

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        working-directory: .
        shell: pwsh
        run: |
          Expand-Archive -Path "Mesen_SFC_Performance_up01_source.zip" -DestinationPath "." -Force

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build version
        shell: pwsh
        run: |
          Set-Content -Path "UI/Dependencies/Internal/BuildSha.txt" -Value "Performance-up01"

      - name: Restore
        run: dotnet restore -p:TargetFramework=net8.0 -r win-x64 -p:PublishAot=false -p:BuildWithNetFrameworkHostedCompiler=true

      - name: Build
        run: msbuild -nologo -m -p:Configuration=Release -p:Platform=x64 -t:Clean,UI -p:TargetFramework=net8.0

      - name: Publish
        run: dotnet publish --no-restore -c Release -p:PublishAot=false -p:SelfContained=true -p:PublishSingleFile=true -p:OptimizeUi=true -p:Platform="Any CPU" -p:TargetFramework=net8.0 -r win-x64 Mesen.sln /p:PublishProfile=UI\Properties\PublishProfiles\Release.pubxml

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Mesen-SFC-Performance-up01
          path: Mesen2-master/build/TmpReleaseBuild/Mesen.exe
          if-no-files-found: error
